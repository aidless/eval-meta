[project]
name = "eval-meta"
version = "1.0.0"
description = "Evaluation-of-evaluation: a runnable meta-evaluation system that makes 'evaluating the evaluator' a first-class citizen"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "sibling_repo: reads a sibling checkout that is not vendored here; skips when those files are absent, and a skip is not a pass",
]
