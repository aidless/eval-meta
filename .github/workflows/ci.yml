name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 46 module tests + 10 integration + 3 CLI = 59 collected.
      # The 10 integration tests need data files that live OUTSIDE this repo
      # (a sibling workspace), so on a clean clone they are skipped by design.
      # The job must therefore assert on collected count, not on "59 passed".
      - name: Run tests
        run: python3 -m pytest tests/ -q -rs

      - name: Module selftests
        run: python3 -m eval_meta.cli selftest
