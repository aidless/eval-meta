name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Counts live in eval_meta/inventory.py. Sibling tests must skip here.
      # A summary of "N passed" with no skips, or a pass count that includes
      # those tests, fails the inventory check. Skips are not passes.
      - name: Run tests
        run: |
          set -o pipefail
          mkdir -p /tmp/eval-meta-no-siblings
          EVAL_META_SIBLING_ROOT=/tmp/eval-meta-no-siblings \
            python3 -m pytest tests/ -q -rs --tb=short | tee pytest-summary.txt
          python3 -m eval_meta.inventory --check-pytest-summary pytest-summary.txt

      - name: Offline path (no sibling clones)
        run: python3 -m eval_meta.cli offline

      - name: Module selftests
        run: python3 -m eval_meta.cli selftest
